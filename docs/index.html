<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ST 台股追蹤儀表板</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg2: #1a1d27;
      --bg3: #22263a;
      --border: #2e3250;
      --text: #e2e8f0;
      --muted: #8892a4;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --blue: #3b82f6;
      --accent: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ── Header ── */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    header h1 { font-size: 18px; font-weight: 700; color: var(--text); }
    header h1 span { color: var(--accent); }
    .update-info { font-size: 12px; color: var(--muted); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-green { background: rgba(34,197,94,.15); color: var(--green); }
    .badge-red { background: rgba(239,68,68,.15); color: var(--red); }
    .badge-yellow { background: rgba(245,158,11,.15); color: var(--yellow); }
    .badge-blue { background: rgba(59,130,246,.15); color: var(--blue); }

    /* ── Main Layout ── */
    main { max-width: 1280px; margin: 0 auto; padding: 20px 16px; }

    /* ── Section ── */
    section { margin-bottom: 24px; }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 12px;
      padding-left: 2px;
    }

    /* ── Summary Cards ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .card-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .card-value { font-size: 22px; font-weight: 700; line-height: 1; }
    .card-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .neutral { color: var(--text); }

    /* ── Position Card ── */
    .position-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 12px;
    }
    .position-card.has-alert { border-color: rgba(245,158,11,.5); }
    .position-card.danger { border-color: rgba(239,68,68,.5); }

    .pos-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .pos-name { font-size: 18px; font-weight: 700; }
    .pos-symbol { font-size: 12px; color: var(--muted); margin-left: 8px; }
    .pos-price { text-align: right; }
    .pos-price-main { font-size: 26px; font-weight: 700; }
    .pos-price-change { font-size: 13px; }

    .pos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      padding: 14px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .pos-stat label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; }
    .pos-stat span { font-size: 14px; font-weight: 600; }

    /* 停損進度條 */
    .stopbar-wrap { margin-top: 10px; }
    .stopbar-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .stopbar-track {
      height: 6px;
      background: var(--bg3);
      border-radius: 3px;
      overflow: hidden;
    }
    .stopbar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width .4s ease;
    }

    /* 警示列表 */
    .alerts { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
    .alert-item {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--bg3);
    }

    /* ── Table ── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg2);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .data-table th {
      background: var(--bg3);
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }
    .data-table td {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }
    .data-table tr:hover td { background: rgba(255,255,255,.02); }
    .text-right { text-align: right; }
    .text-mono { font-variant-numeric: tabular-nums; }

    /* ── Global Indicators Grid ── */
    .indicator-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .indicator-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .ind-name { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .ind-price { font-size: 18px; font-weight: 700; }
    .ind-change { font-size: 12px; }

    /* ── Alert Banner ── */
    .alert-banner {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .alert-banner .icon { font-size: 18px; }

    /* ── Loading ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 12px;
      color: var(--muted);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    footer {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding: 20px;
      border-top: 1px solid var(--border);
      margin-top: 20px;
    }

    /* ── Recommendation Section ── */
    .rec-outlook {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .rec-outlook.bearish { border-left: 4px solid var(--red); }
    .rec-outlook.bullish { border-left: 4px solid var(--green); }
    .rec-outlook.neutral-out { border-left: 4px solid var(--yellow); }
    .rec-direction { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .rec-summary { font-size: 12px; color: var(--muted); max-width: 520px; line-height: 1.6; }
    .rec-target { font-size: 12px; margin-top: 6px; }

    .rec-top3-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    .rec-top3-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .rec-rank { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .rec-stock-name { font-size: 16px; font-weight: 700; }
    .rec-stock-sym { font-size: 12px; color: var(--muted); margin-left: 6px; }
    .rec-score { font-size: 12px; margin-top: 6px; }
    .rec-entry { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .rec-reason { font-size: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); line-height: 1.5; }

    .rec-no-trade {
      background: rgba(245,158,11,.08);
      border: 1px solid rgba(245,158,11,.3);
      border-radius: 10px;
      padding: 16px 20px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--yellow);
    }

    .rec-action-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }
    .rec-action-card.high { border-left: 4px solid var(--red); }
    .rec-action-card.medium { border-left: 4px solid var(--yellow); }
    .rec-action-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
    .rec-action-alerts { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .rec-action-alert { font-size: 12px; padding: 5px 10px; background: var(--bg3); border-radius: 5px; }
    .scenario-table { width: 100%; border-collapse: collapse; }
    .scenario-table td {
      padding: 7px 10px;
      font-size: 12px;
      border-top: 1px solid var(--border);
      vertical-align: top;
    }
    .scenario-table tr:first-child td { border-top: none; }
    .scenario-condition { color: var(--muted); width: 42%; }

    .r47-banner {
      background: rgba(99,102,241,.1);
      border: 1px solid rgba(99,102,241,.35);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.5;
    }
    .dram-banner {
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .rec-date-badge {
      font-size: 11px;
      color: var(--muted);
      background: var(--bg3);
      padding: 2px 8px;
      border-radius: 9999px;
      margin-left: 8px;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      main { padding: 14px 12px; }
      .pos-price-main { font-size: 20px; }
    }
  </style>
</head>
<body>

<header>
  <h1>📈 <span>ST</span> 台股追蹤儀表板</h1>
  <div class="update-info" id="updateInfo">載入中…</div>
</header>

<main>
  <div id="loading">
    <div class="spinner"></div>
    <div>載入最新數據…</div>
  </div>
  <div id="app" style="display:none"></div>
</main>

<footer>
  ST 台股追蹤系統 V0014補4 ｜ 數據來源：TWSE 官方 + Yahoo Finance ｜ 僅供個人參考，不構成投資建議
</footer>

<script>
// ── 輔助函數 ─────────────────────────────────────────────────
const fmt = {
  price:   (v, d=2) => v == null ? "–" : Number(v).toFixed(d),
  pct:     (v)      => v == null ? "–" : `${v >= 0 ? "+" : ""}${Number(v).toFixed(2)}%`,
  money:   (v)      => v == null ? "–" : `NT$${Math.round(v).toLocaleString()}`,
  vol:     (v)      => v == null ? "–" : Number(v).toLocaleString(),
  date:    (iso)    => {
    if (!iso) return "–";
    try {
      const d = new Date(iso);
      return d.toLocaleString("zh-TW", { timeZone: "Asia/Taipei",
        month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
    } catch { return iso; }
  },
};

const colorClass = (v) => v > 0 ? "pos" : v < 0 ? "neg" : "neutral";

// 停損距離百分比（0=已停損, 100=距停損很遠）
function stopBarPct(price, stopLoss) {
  if (!price || !stopLoss) return 0;
  const range = price * 0.15; // 以當前價15%為顯示範圍
  const dist = price - stopLoss;
  return Math.min(100, Math.max(0, (dist / range) * 100));
}
function stopBarColor(pct) {
  if (pct < 20) return "#ef4444";
  if (pct < 40) return "#f59e0b";
  return "#22c55e";
}

// ── 渲染函數 ─────────────────────────────────────────────────
function renderGlobal(data) {
  const app = document.getElementById("app");
  const { summary, positions, watchlist, globalIndicators, _meta } = data;

  // 更新 header 時間
  document.getElementById("updateInfo").textContent =
    `最後更新：${fmt.date(_meta.updatedAt)}（${_meta.version}）`;

  let html = "";

  // ── 警示橫幅 ──────────────────────────────────────────────
  const criticalAlerts = positions.flatMap(p =>
    (p.alerts || []).filter(a => a.startsWith("🔴"))
  );
  if (criticalAlerts.length > 0) {
    html += `<div class="alert-banner">
      <span class="icon">🚨</span>
      <div>
        <strong>緊急警示（${criticalAlerts.length}）</strong>
        <div style="font-size:12px;margin-top:3px">${criticalAlerts.join(" ／ ")}</div>
      </div>
    </div>`;
  }

  // ── 總覽卡片 ───────────────────────────────────────────────
  const pnlClass = colorClass(summary.totalPnl);
  html += `
  <section>
    <div class="section-title">持倉總覽</div>
    <div class="summary-grid">
      <div class="card">
        <div class="card-label">總市值</div>
        <div class="card-value neutral">${fmt.money(summary.totalMarketValue)}</div>
        <div class="card-sub">成本 ${fmt.money(summary.totalCostValue)}</div>
      </div>
      <div class="card">
        <div class="card-label">浮動損益</div>
        <div class="card-value ${pnlClass}">${summary.totalPnl >= 0 ? "+" : ""}${fmt.money(summary.totalPnl)}</div>
        <div class="card-sub ${pnlClass}">${fmt.pct(summary.totalPnlPercent)}</div>
      </div>
      <div class="card">
        <div class="card-label">持倉檔數</div>
        <div class="card-value neutral">${summary.positionCount}</div>
        <div class="card-sub">${summary.hasAlerts ? '<span class="badge badge-yellow">有警示</span>' : '<span class="badge badge-green">正常</span>'}</div>
      </div>
      <div class="card">
        <div class="card-label">數據日期</div>
        <div class="card-value neutral" style="font-size:16px">${_meta.dataDate.replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3")}</div>
        <div class="card-sub">TWSE / Yahoo Finance</div>
      </div>
    </div>
  </section>`;

  // ── 持倉明細 ───────────────────────────────────────────────
  html += `<section><div class="section-title">當前持倉</div>`;
  if (positions.length === 0) {
    html += `<div class="card" style="color:var(--muted);text-align:center;padding:30px">目前無持倉</div>`;
  }
  for (const p of positions) {
    const hasRed = (p.alerts || []).some(a => a.startsWith("🔴"));
    const hasYellow = (p.alerts || []).some(a => a.startsWith("🟡"));
    const cardClass = hasRed ? "danger" : hasYellow ? "has-alert" : "";
    const pnlC = colorClass(p.pnl);
    const chgC = colorClass(p.changePercent);
    const barPct = stopBarPct(p.price, p.stopLoss);
    const barColor = stopBarColor(barPct);

    html += `
    <div class="position-card ${cardClass}">
      <div class="pos-header">
        <div>
          <span class="pos-name">${p.name}</span>
          <span class="pos-symbol">${p.symbol}</span>
          ${p.dataDate ? `<span class="badge badge-blue" style="margin-left:8px">${p.dataDate}</span>` : ""}
        </div>
        <div class="pos-price">
          <div class="pos-price-main ${chgC}">${fmt.price(p.price)}</div>
          <div class="pos-price-change ${chgC}">${fmt.pct(p.changePercent)} (${p.change >= 0 ? "+" : ""}${fmt.price(p.change)})</div>
        </div>
      </div>

      <div class="pos-grid">
        <div class="pos-stat"><label>持股數</label><span>${p.shares?.toLocaleString()} 股</span></div>
        <div class="pos-stat"><label>均攤成本</label><span>${fmt.price(p.costPerShare)}</span></div>
        <div class="pos-stat"><label>市值</label><span>${fmt.money(p.marketValue)}</span></div>
        <div class="pos-stat"><label>浮動損益</label><span class="${pnlC}">${p.pnl >= 0 ? "+" : ""}${fmt.money(p.pnl)}</span></div>
        <div class="pos-stat"><label>損益%</label><span class="${pnlC}">${fmt.pct(p.pnlPercent)}</span></div>
        <div class="pos-stat"><label>開盤</label><span>${fmt.price(p.open)}</span></div>
        <div class="pos-stat"><label>最高</label><span>${fmt.price(p.high)}</span></div>
        <div class="pos-stat"><label>最低</label><span>${fmt.price(p.low)}</span></div>
      </div>

      <div class="stopbar-wrap">
        <div class="stopbar-label">
          <span>停損線 ${fmt.price(p.stopLoss)} ← 距離 ${p.price && p.stopLoss ? fmt.price(p.price - p.stopLoss) : "–"} 元</span>
          ${p.alertStopLoss ? `<span>⚠️ 警戒線 ${fmt.price(p.alertStopLoss)}</span>` : ""}
        </div>
        <div class="stopbar-track">
          <div class="stopbar-fill" style="width:${barPct}%;background:${barColor}"></div>
        </div>
      </div>

      ${(p.alerts || []).length > 0 ? `
      <div class="alerts">
        ${p.alerts.map(a => `<div class="alert-item">${a}</div>`).join("")}
      </div>` : ""}

      ${p.notes ? `<div style="font-size:11px;color:var(--muted);margin-top:8px">📝 ${p.notes}</div>` : ""}
    </div>`;
  }
  html += `</section>`;

  // ── 全球指標 ───────────────────────────────────────────────
  html += `<section><div class="section-title">全球指標</div><div class="indicator-grid">`;
  const nameMap = {
    "^TWII":"加權指數","TSM":"台積電ADR","MU":"美光MU","SNDK":"SanDisk",
    "NVDA":"NVIDIA","^SOX":"費半SOX","^VIX":"VIX恐慌","NQ=F":"那指期指",
  };
  for (const ind of globalIndicators) {
    const cc = colorClass(ind.changePercent);
    const name = nameMap[ind.symbol] || ind.symbol;
    html += `
    <div class="indicator-card">
      <div class="ind-name">${name}</div>
      ${ind.error
        ? `<div style="color:var(--muted);font-size:12px">無法取得</div>`
        : `<div class="ind-price ${cc}">${fmt.price(ind.price, ind.price > 1000 ? 0 : 2)}</div>
           <div class="ind-change ${cc}">${fmt.pct(ind.changePercent)}</div>`
      }
    </div>`;
  }
  html += `</div></section>`;

  // ── 觀察清單 ───────────────────────────────────────────────
  const watchNameMap = {
    "2330.TW":"台積電","2303.TW":"聯電","2408.TW":"南亞科",
    "2344.TW":"華邦電","2337.TW":"旺宏","6770.TW":"力積電",
    "2317.TW":"鴻海","2454.TW":"聯發科","2357.TW":"華碩",
  };
  html += `
  <section>
    <div class="section-title">觀察清單</div>
    <div style="overflow-x:auto">
    <table class="data-table">
      <thead>
        <tr>
          <th>代號</th><th>名稱</th><th class="text-right">收盤</th>
          <th class="text-right">漲跌</th><th class="text-right">漲跌幅</th>
          <th class="text-right">開盤</th><th class="text-right">最高</th>
          <th class="text-right">最低</th><th class="text-right">資料日</th>
        </tr>
      </thead>
      <tbody>
        ${watchlist.map(w => {
          const cc = colorClass(w.changePercent);
          return `<tr>
            <td><code style="font-size:12px;color:var(--muted)">${w.symbol}</code></td>
            <td><strong>${watchNameMap[w.symbol] || w.symbol}</strong></td>
            ${w.error
              ? `<td colspan="7" style="color:var(--muted)">無法取得</td>`
              : `<td class="text-right text-mono">${fmt.price(w.price)}</td>
                 <td class="text-right text-mono ${cc}">${w.change >= 0 ? "+" : ""}${fmt.price(w.change)}</td>
                 <td class="text-right text-mono ${cc}">${fmt.pct(w.changePercent)}</td>
                 <td class="text-right text-mono">${fmt.price(w.open)}</td>
                 <td class="text-right text-mono">${fmt.price(w.high)}</td>
                 <td class="text-right text-mono">${fmt.price(w.low)}</td>
                 <td class="text-right" style="font-size:11px;color:var(--muted)">${w.dataDate || "–"}</td>`
            }
          </tr>`;
        }).join("")}
      </tbody>
    </table>
    </div>
  </section>`;

  app.innerHTML += html;
}

// ── 盤前分析渲染 ──────────────────────────────────────────────
function renderRecommendations(rec) {
  if (!rec) return "";
  const { _meta, marketOutlook, r47Alert, dram, top3, noTradeReason,
          watchForRebound, portfolioActions, keyIndicators } = rec;

  let html = `
  <section>
    <div class="section-title">
      📋 盤前分析
      <span class="rec-date-badge">${_meta?.date || ""}</span>
      <span class="rec-date-badge" style="color:var(--accent)">${_meta?.modelVersion || ""}</span>
    </div>`;

  // ── 市場方向 ──
  const dirColor = marketOutlook?.directionColor === "red" ? "bearish"
                 : marketOutlook?.directionColor === "green" ? "bullish" : "neutral-out";
  const dirTextColor = marketOutlook?.directionColor === "red" ? "var(--red)"
                     : marketOutlook?.directionColor === "green" ? "var(--green)" : "var(--yellow)";
  html += `
    <div class="rec-outlook ${dirColor}">
      <div>
        <div class="rec-direction" style="color:${dirTextColor}">${marketOutlook?.direction || "–"}</div>
        <div class="rec-summary">${marketOutlook?.summary || ""}</div>
        ${marketOutlook?.indexTarget ? `<div class="rec-target">🎯 ${marketOutlook.indexTarget}</div>` : ""}
        ${marketOutlook?.operationMode ? `<div class="rec-target" style="color:var(--muted)">🛡️ ${marketOutlook.operationMode}</div>` : ""}
      </div>
      ${keyIndicators ? `
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end">
        ${Object.entries(keyIndicators).map(([k, v]) => {
          const cc = v.value > 0 ? "pos" : v.value < 0 ? "neg" : "neutral";
          return `<div style="text-align:center;min-width:52px">
            <div style="font-size:10px;color:var(--muted)">${v.label}</div>
            <div class="${cc}" style="font-size:13px;font-weight:700">${v.value > 0 ? "+" : ""}${v.value}%</div>
          </div>`;
        }).join("")}
      </div>` : ""}
    </div>`;

  // ── R47 警戒 ──
  if (r47Alert) {
    html += `<div class="r47-banner">
      <span>⚡</span>
      <div><strong>R47 警戒</strong>：${r47Alert}</div>
    </div>`;
  }

  // ── DRAM 族群警報 ──
  if (dram?.triggered) {
    html += `<div class="dram-banner">
      🔴 <strong>DRAM 族群信號 ${dram.signal}</strong>：${dram.detail}
      ${dram.avoid?.length ? `<br>⛔ 迴避標的：<strong>${dram.avoid.join("、")}</strong>` : ""}
    </div>`;
  }

  // ── Top 3 推薦 ──
  if (top3 && top3.length > 0) {
    html += `<div class="rec-top3-grid">`;
    for (const s of top3) {
      html += `
      <div class="rec-top3-card">
        <div class="rec-rank">#${s.rank} 推薦</div>
        <div>
          <span class="rec-stock-name">${s.name}</span>
          <span class="rec-stock-sym">${s.symbol}</span>
          <span class="badge badge-blue" style="margin-left:6px">${s.score}</span>
        </div>
        ${s.entryZone ? `<div class="rec-entry">📍 進場區 ${s.entryZone}　停損 ${s.stopLoss}</div>` : ""}
        ${s.reason ? `<div class="rec-reason">${s.reason}</div>` : ""}
        ${(s.warnings || []).length > 0 ? `<div style="margin-top:6px">${s.warnings.map(w => `<div class="alert-item" style="font-size:11px;margin-top:3px">${w}</div>`).join("")}</div>` : ""}
      </div>`;
    }
    html += `</div>`;
  } else if (noTradeReason) {
    html += `<div class="rec-no-trade">🚫 今日不開新倉<br>${noTradeReason}</div>`;
  }

  // ── 反彈觀察 ──
  if (watchForRebound && watchForRebound.length > 0) {
    html += `<div style="margin-top:10px;font-size:12px;color:var(--muted)">
      👀 反彈觀察：${watchForRebound.map(w => `<strong style="color:var(--text)">${w.name}（${w.symbol}）</strong> — ${w.note}`).join("；")}
    </div>`;
  }

  // ── 庫存操作建議 ──
  if (portfolioActions && portfolioActions.length > 0) {
    html += `<div style="margin-top:16px"><div class="section-title" style="margin-bottom:8px">庫存操作建議</div>`;
    for (const pa of portfolioActions) {
      html += `
      <div class="rec-action-card ${pa.urgency}">
        <div class="rec-action-title">
          ${pa.urgency === "high" ? "🔴" : pa.urgency === "medium" ? "🟡" : "⚪"}
          ${pa.name} <span style="font-size:12px;color:var(--muted);font-weight:400">${pa.symbol}</span>
          <span class="badge ${pa.urgency === 'high' ? 'badge-red' : 'badge-yellow'}" style="margin-left:8px">
            ${pa.urgency === 'high' ? '高優先' : '注意'}
          </span>
        </div>`;
      if (pa.alerts && pa.alerts.length > 0) {
        html += `<div class="rec-action-alerts">${pa.alerts.map(a => `<div class="rec-action-alert">${a}</div>`).join("")}</div>`;
      }
      if (pa.scenarios && pa.scenarios.length > 0) {
        html += `<table class="scenario-table">`;
        for (const sc of pa.scenarios) {
          html += `<tr>
            <td class="scenario-condition">📌 ${sc.condition}</td>
            <td>${sc.action}</td>
          </tr>`;
        }
        html += `</table>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  html += `</section>`;
  return html;
}

// ── 主程式 ───────────────────────────────────────────────────
async function main() {
  try {
    // 並行載入 latest.json 和 recommendations.json
    const [res, recRes] = await Promise.all([
      fetch("data/latest.json?t=" + Date.now()),
      fetch("data/recommendations.json?t=" + Date.now()).catch(() => null),
    ]);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const rec = recRes?.ok ? await recRes.json() : null;

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "block";

    // 先插入盤前分析（若有），再渲染持倉
    const recHtml = renderRecommendations(rec);
    document.getElementById("app").innerHTML = recHtml;
    renderGlobal(data);          // 追加到 app
  } catch (err) {
    document.getElementById("loading").innerHTML = `
      <div style="font-size:32px">⚠️</div>
      <div>無法載入數據</div>
      <div style="font-size:12px;max-width:300px;text-align:center">${err.message}</div>
      <div style="font-size:12px;color:var(--muted)">請確認 GitHub Actions 已成功執行，或手動執行 <code>node scripts/fetch-data.js</code></div>
    `;
  }
}

main();
</script>
</body>
</html>
