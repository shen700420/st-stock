name: 📊 Update Stock Data

on:
  schedule:
    # ── 台灣交易時段 9:00–14:40，每 20 分鐘自動抓一次 ──────────
    # UTC 01:00–06:40 = Taipei 09:00–14:40（週一至週五）
    - cron: '0,20,40 1,2,3,4,5 * * 1-5'
    - cron: '0,20,40 6 * * 1-5'      # UTC 06:00/06:20/06:40

    # ── 收盤後最終一次（14:50）──────────────────────────────────
    - cron: '50 6 * * 1-5'

  # 允許手動觸發（GitHub UI 上直接按 Run）
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期（YYYYMMDD，留空=今日）'
        required: false
        default: ''

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📊 Fetch stock data
        run: node scripts/fetch-data.js
        env:
          TZ: Asia/Taipei

      - name: 💾 Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --staged --quiet || \
            git commit -m "📊 Auto-update $(TZ='Asia/Taipei' date +'%Y-%m-%d %H:%M') (Taipei)"
          git push
