name: 📊 Update Stock Data

on:
  schedule:
    # 台灣時間 下午 2:45（收盤後約1小時），週一至週五
    # UTC 06:45 = Taipei 14:45 (UTC+8)
    - cron: '45 6 * * 1-5'

  # 允許手動觸發
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期（YYYYMMDD，留空=今日）'
        required: false
        default: ''

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 push 數據

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📊 Fetch stock data
        run: node scripts/fetch-data.js
        env:
          TZ: Asia/Taipei

      - name: 💾 Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          # 有變更才 commit（避免空 commit）
          git diff --staged --quiet || \
            git commit -m "📊 Auto-update $(TZ='Asia/Taipei' date +'%Y-%m-%d %H:%M') (Taipei)"
          git push
